<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two-Layer KG · OT data ⟷ reference ontology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1317; --panel:#101b21; --line:#22343d; --ink:#cdd9df; --muted:#6e8590;
    --amber:#f5b14c; --efo:#e5484d; --mondo:#f76808; --target:#3fb98f; --go:#4cb963;
    --uberon:#4f74f0; --oba:#e2b203; --safety:#e5484d; --link:#4fc3d6;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Space Grotesk",system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  header{ padding:18px 24px 12px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
  header h1{ font-size:18px; font-weight:600; margin:0; letter-spacing:-.01em;}
  header p{ margin:0; color:var(--muted); font-size:12.5px;}
  .bar{ display:flex; gap:10px; align-items:center; padding:10px 24px; border-bottom:1px solid var(--line);}
  .bar button{ font-family:"Space Grotesk",sans-serif; font-size:12.5px; color:var(--ink); background:#16242c; border:1px solid var(--line); border-radius:8px; padding:7px 14px; cursor:pointer;}
  .bar button.go{ background:var(--amber); color:#1a1206; border-color:var(--amber); font-weight:600;}
  .bar button:hover{ border-color:#3a5664;}
  .bar .note{ color:var(--muted); font-size:11.5px; font-family:"JetBrains Mono",monospace; margin-left:6px;}
  svg{ width:100%; height:auto; display:block;}
  .plane{ fill:#0e171d; stroke:#1c2c34; stroke-width:1; }
  .plane.right{ fill:#0d161c; }
  .planeHdr{ font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .planeSub{ font-size:10.5px; fill:var(--muted); font-family:"JetBrains Mono",monospace;}
  .seam{ stroke:#22343d; stroke-width:1; stroke-dasharray:2 6;}
  .seamLbl{ fill:var(--link); font-size:10px; font-family:"JetBrains Mono",monospace; letter-spacing:.08em;}
  /* edges */
  .edge{ fill:none; stroke-linecap:round; transition:opacity .2s;}
  .edge.assoc{ stroke:var(--amber); stroke-width:2.4;}
  .edge.drug{ stroke:var(--mondo); stroke-width:1.9;}
  .edge.isa{ stroke:#3a4d57; stroke-width:1.5;}
  .edge.match{ stroke:var(--mondo); stroke-width:1.7; stroke-dasharray:5 4;}
  .edge.link{ stroke:var(--link); stroke-width:1.7; stroke-dasharray:4 4;}
  .edge.search{ stroke:var(--amber); stroke-width:2; stroke-dasharray:1 5;}
  .elabel{ font-family:"JetBrains Mono",monospace; font-size:9px; fill:#9fb4bd;}
  .elabel rect{ fill:#0b1317;}
  .elabel.sec{ opacity:0; transition:opacity .2s;}
  /* nodes */
  .card rect.body{ fill:#16242c; stroke:var(--line); stroke-width:1.2; transition:stroke .2s, opacity .2s;}
  .card.concept rect.body{ fill:#10202a; }
  .card text.nm{ fill:var(--ink); font-size:12px; font-weight:600;}
  .card text.kd{ fill:var(--muted); font-family:"JetBrains Mono",monospace; font-size:8.5px;}
  .card text.id{ fill:var(--muted); font-family:"JetBrains Mono",monospace; font-size:9px;}
  .card:hover rect.body{ stroke:#4a6b7a;}
  .search rect{ fill:#1a1206; stroke:var(--amber); stroke-width:1.4;}
  .search text{ fill:var(--amber); font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:600;}
  .evnode polygon{ fill:#1a2129; stroke:var(--amber); stroke-width:1.5;}
  .evnode text{ fill:var(--amber); font-size:8.5px; font-family:"JetBrains Mono",monospace; font-weight:600;}
  .payload rect{ fill:#0a1216; stroke:#2a3f49; stroke-width:1; }
  .payload text{ font-family:"JetBrains Mono",monospace; font-size:9px;}
  .payload .k{ fill:var(--link);} .payload .v{ fill:#9fb4bd;}
  /* trace dim */
  svg.tracing .edge:not(.lit){ opacity:.07 !important;}
  svg.tracing .card:not(.lit) rect.body{ opacity:.22;}
  svg.tracing .card:not(.lit) text{ opacity:.22;}
  svg.tracing .elabel:not(.lit){ opacity:0 !important;}
  svg.tracing .evnode:not(.lit){ opacity:.22;}
  svg.tracing .payload:not(.lit){ opacity:.25;}
  .lit{ opacity:1 !important;}
  .edge.lit{ stroke-width:3 !important;}
  .card.lit rect.body{ stroke:var(--amber) !important; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; padding:10px 16px 20px; border-top:1px solid var(--line);}
  .legend .it{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:#aebfc7;}
  .legend .ln{ width:22px; height:0; flex:0 0 22px;}
  @media (max-width:680px){ header h1{font-size:16px;} }
</style>
</head>
<body>
<header>
  <h1>Two-layer knowledge graph</h1>
  <p>Open Targets data graph on the left · reference ontology layer at the side · joined by <span style="color:var(--link);font-family:'JetBrains Mono',monospace">IS_TERM</span></p>
</header>
<div class="bar">
  <button class="go" id="trace">▶ Trace a search: "Alzheimer's"</button>
  <button id="reset">Reset</button>
  <span class="note">search resolves in the ontology → hops into OT data</span>
</div>

<svg id="svg" viewBox="0 0 1320 880" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two-layer knowledge graph schematic">
  <!-- planes -->
  <rect class="plane" x="28" y="132" width="612" height="688" rx="14"/>
  <rect class="plane right" x="692" y="132" width="600" height="688" rx="14"/>
  <text class="planeHdr" x="46" y="160" fill="#9fb4bd">OPEN TARGETS KG</text>
  <text class="planeSub" x="46" y="176">built from all OT data — the graph you query</text>
  <text class="planeHdr" x="710" y="160" fill="#9fb4bd">REFERENCE ONTOLOGY LAYER</text>
  <text class="planeSub" x="710" y="176">semantics at the side — search · disambiguation · roll-up</text>
  <line class="seam" x1="666" y1="150" x2="666" y2="812"/>
  <text class="seamLbl" x="666" y="146" text-anchor="middle">link layer</text>

  <g id="edges"></g>
  <g id="nodes"></g>
  <g id="labels"></g>
</svg>

<div class="legend">
  <div class="it"><span class="ln" style="border-top:2.4px solid var(--amber)"></span>ASSOCIATED_WITH (OT)</div>
  <div class="it"><span class="ln" style="border-top:1.9px solid var(--mondo)"></span>drug edges (OT)</div>
  <div class="it"><span class="ln" style="border-top:1.7px dashed var(--link)"></span>IS_TERM / annotates (the join)</div>
  <div class="it"><span class="ln" style="border-top:1.5px solid #3a4d57"></span>IS_A (ontology)</div>
  <div class="it"><span class="ln" style="border-top:1.7px dashed var(--mondo)"></span>EXACT_MATCH (collapses dupes)</div>
</div>

<script>
const SVGNS='http://www.w3.org/2000/svg';
const el=(n,a)=>{const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const gE=document.getElementById('edges'), gN=document.getElementById('nodes'), gL=document.getElementById('labels');
const COL={efo:'#e5484d',mondo:'#f76808',target:'#3fb98f',go:'#4cb963',uberon:'#4f74f0',oba:'#e2b203',safety:'#e5484d'};

// nodes: id, kind(data|concept), name, sub, id-text, cx, cy, color, [focal]
const N=[
  // search
  {id:'search', kind:'search', name:'⌕  "Alzheimer\'s"', cx:158, cy:98, w:240, h:44},
  // OT data (left)
  {id:'ot_dis', kind:'data', name:'Alzheimer disease', kd:'«Disease»', idt:'EFO:0000249', cx:322, cy:480, c:COL.efo},
  {id:'ot_app', kind:'data', name:'APP', kd:'«Target»', idt:'ENSG…142192', cx:146, cy:340, c:COL.target},
  {id:'ot_ps1', kind:'data', name:'PSEN1', kd:'«Target»', idt:'ENSG…080815', cx:146, cy:630, c:COL.target},
  {id:'ot_drug',kind:'data', name:'Donepezil', kd:'«Drug»', idt:'CHEMBL502', cx:520, cy:300, c:COL.mondo},
  {id:'ot_ae',  kind:'data', name:'Insomnia', kd:'«AdverseEvent»', idt:'FAERS', cx:520, cy:650, c:COL.safety},
  // ontology concepts (right)
  {id:'c_nerv', kind:'concept', name:'nervous system disease', kd:'Concept', idt:'EFO:0000618', cx:846, cy:200, c:COL.efo},
  {id:'c_neuro',kind:'concept', name:'neurodegenerative disease', kd:'Concept', idt:'EFO:0005772', cx:846, cy:340, c:COL.efo},
  {id:'c_alz',  kind:'concept', name:'Alzheimer disease', kd:'Concept', idt:'EFO:0000249', cx:846, cy:490, c:COL.efo, focal:true},
  {id:'c_mondo',kind:'concept', name:'Alzheimer disease', kd:'Concept', idt:'MONDO:0004975', cx:1086, cy:470, c:COL.mondo},
  {id:'c_go',   kind:'concept', name:'apoptotic process', kd:'Concept', idt:'GO:0006915', cx:1090, cy:260, c:COL.go},
  {id:'c_ub',   kind:'concept', name:'brain', kd:'Concept', idt:'UBERON:0000955', cx:1090, cy:620, c:COL.uberon},
  {id:'c_chebi',kind:'concept', name:'donepezil (chem class)', kd:'Concept', idt:'CHEBI:53289', cx:846, cy:660, c:COL.oba},
  {id:'c_med',  kind:'concept', name:'Insomnia (PT)', kd:'Concept', idt:'MedDRA:10022437', cx:1086, cy:740, c:COL.safety},
];
const byId=Object.fromEntries(N.map(n=>[n.id,n]));
const EV={cx:240,cy:412};
const D=(n)=> n.kind==='search' ? {w:n.w,h:n.h} : n.focal ? {w:188,h:60} : {w:170,h:52};
function border(n,tx,ty){const {w,h}=D(n);const hw=w/2,hh=h/2;let dx=tx-n.cx,dy=ty-n.cy;if(!dx&&!dy)return{x:n.cx,y:n.cy};const s=Math.min(dx?hw/Math.abs(dx):1e9, dy?hh/Math.abs(dy):1e9);return{x:n.cx+dx*s,y:n.cy+dy*s};}
function ptOf(t){ return t==='_ev'?{cx:EV.cx,cy:EV.cy,kind:'ev'}:byId[t]; }

// edges: id, from, to, cls, label, primary
const E=[
  // OT data edges
  {id:'e_assoc1', f:'ot_app', t:'_ev', cls:'assoc'},
  {id:'e_assoc2', f:'_ev', t:'ot_dis', cls:'assoc', label:'ASSOCIATED_WITH', primary:true},
  {id:'e_assoc3', f:'ot_ps1', t:'ot_dis', cls:'assoc'},
  {id:'e_targets',f:'ot_drug',t:'ot_app', cls:'drug', label:'TARGETS'},
  {id:'e_indic',  f:'ot_drug',t:'ot_dis', cls:'drug', label:'INDICATED_FOR', primary:true},
  {id:'e_ae',     f:'ot_drug',t:'ot_ae',  cls:'drug', label:'HAS_ADVERSE_EVENT'},
  // ontology hierarchy
  {id:'e_isa1', f:'c_alz', t:'c_neuro', cls:'isa', label:'IS_A'},
  {id:'e_isa2', f:'c_neuro', t:'c_nerv', cls:'isa'},
  {id:'e_match',f:'c_alz', t:'c_mondo', cls:'match', label:'EXACT_MATCH', primary:true},
  // the join (link layer, crosses the seam)
  {id:'e_link_dis', f:'ot_dis', t:'c_alz', cls:'link', label:'IS_TERM', primary:true},
  {id:'e_link_appgo',f:'ot_app', t:'c_go', cls:'link', label:'HAS_FUNCTION'},
  {id:'e_link_appub',f:'ot_app', t:'c_ub', cls:'link', label:'EXPRESSED_IN'},
  {id:'e_link_psub', f:'ot_ps1', t:'c_ub', cls:'link'},
  {id:'e_link_drug', f:'ot_drug', t:'c_chebi', cls:'link', label:'structure'},
  {id:'e_link_ae',   f:'ot_ae', t:'c_med', cls:'link', label:'IS_TERM'},
  // search resolve
  {id:'e_search', f:'search', t:'c_alz', cls:'search', label:'resolve syn/xref', primary:true},
];

function drawEdge(e){
  const a=ptOf(e.f), b=ptOf(e.t);
  const p1 = e.f==='_ev'?{x:EV.cx,y:EV.cy}:border(a,b.cx,b.cy);
  const p2 = e.t==='_ev'?{x:EV.cx,y:EV.cy}:border(b,a.cx,a.cy);
  gE.appendChild(el('path',{id:e.id, class:'edge '+e.cls, d:`M${p1.x},${p1.y} L${p2.x},${p2.y}`}));
  if(e.label){
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    const g=el('g',{class:'elabel '+(e.primary?'':'sec'),'data-eid':e.id});
    const tw=e.label.length*5.4+8;
    g.appendChild(el('rect',{x:mx-tw/2,y:my-7.5,width:tw,height:13,rx:3}));
    const t=el('text',{x:mx,y:my+2.5,'text-anchor':'middle'});t.textContent=e.label;g.appendChild(t);
    gL.appendChild(g);
  }
}
function drawNode(n){
  if(n.kind==='search'){
    const g=el('g',{class:'card search','data-id':n.id, tabindex:'0'});
    g.appendChild(el('rect',{class:'rect',x:n.cx-n.w/2,y:n.cy-n.h/2,width:n.w,height:n.h,rx:22}));
    const t=el('text',{x:n.cx,y:n.cy+4.5,'text-anchor':'middle'});t.textContent=n.name;g.appendChild(t);
    gN.appendChild(g); return;
  }
  const {w,h}=D(n);
  const g=el('g',{class:'card '+(n.kind==='concept'?'concept':'data'),'data-id':n.id, tabindex:'0'});
  g.appendChild(el('rect',{class:'body',x:n.cx-w/2,y:n.cy-h/2,width:w,height:h,rx: n.kind==='concept'?14:8}));
  if(n.kind==='concept'){
    g.appendChild(el('rect',{x:n.cx-w/2,y:n.cy-h/2,width:w,height:h,rx:14,fill:'none',stroke:n.c,'stroke-width':1.6,opacity:.85}));
  }else{
    g.appendChild(el('rect',{x:n.cx-w/2,y:n.cy-h/2,width:5,height:h,rx:2.5,fill:n.c}));
  }
  const x0=n.cx-w/2+(n.kind==='concept'?14:14);
  const kd=el('text',{class:'kd',x:x0,y:n.cy-13});kd.textContent=n.kd;g.appendChild(kd);
  const nm=el('text',{class:'nm',x:x0,y:n.cy+3});nm.textContent=n.name;
  if(n.focal)nm.setAttribute('font-size','13');
  g.appendChild(nm);
  const idt=el('text',{class:'id',x:x0,y:n.cy+16});idt.textContent=n.idt;g.appendChild(idt);
  gN.appendChild(g);
}
function drawEV(){
  const g=el('g',{class:'evnode','data-id':'_ev'});const s=15;
  g.appendChild(el('polygon',{points:`${EV.cx},${EV.cy-s} ${EV.cx+s+6},${EV.cy} ${EV.cx},${EV.cy+s} ${EV.cx-s-6},${EV.cy}`}));
  const t=el('text',{x:EV.cx,y:EV.cy+3,'text-anchor':'middle'});t.textContent='Evid';g.appendChild(t);
  gN.appendChild(g);
}
function drawPayload(){
  // attached to c_alz: what a Concept carries
  const x=722,y=528,w=250,h=86;
  const g=el('g',{class:'payload','data-id':'payload'});
  g.appendChild(el('rect',{x:x,y:y,width:w,height:h,rx:8}));
  const rows=[['syn:','Alzheimer\'s dementia · AD'],['xref:','ICD10:G30 · UMLS:C0002395'],['def:','progressive neurodegenerative…']];
  rows.forEach((r,i)=>{
    const yy=y+22+i*22;
    const k=el('text',{class:'k',x:x+12,y:yy});k.textContent=r[0];g.appendChild(k);
    const v=el('text',{class:'v',x:x+50,y:yy});v.textContent=r[1];g.appendChild(v);
  });
  // connector to c_alz bottom
  g.appendChild(el('path',{class:'edge link',d:`M846,520 L846,${y}`}));
  gN.appendChild(g);
}

E.forEach(drawEdge);
drawEV();
N.forEach(drawNode);
drawPayload();

// ---- hover highlight ----
const svg=document.getElementById('svg');
// ---- trace sequence ----
const SEQ=['search','e_search','c_alz','payload','e_link_dis','ot_dis','e_assoc2','_ev','e_assoc1','ot_app','e_assoc3','ot_ps1','e_indic','ot_drug'];
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let timers=[];
function clearTrace(){ timers.forEach(clearTimeout); timers=[];
  svg.classList.remove('tracing');
  document.querySelectorAll('.lit').forEach(n=>n.classList.remove('lit'));
}
function lite(key){
  const node=document.querySelector(`[data-id="${key}"]`); if(node)node.classList.add('lit');
  const edge=document.getElementById(key); if(edge)edge.classList.add('lit');
  const lbl=document.querySelector(`.elabel[data-eid="${key}"]`); if(lbl)lbl.classList.add('lit');
}
function trace(){
  clearTrace(); svg.classList.add('tracing');
  if(reduce){ SEQ.forEach(lite); return; }
  SEQ.forEach((key,i)=> timers.push(setTimeout(()=>lite(key), i*430)) );
}
document.getElementById('trace').addEventListener('click',trace);
document.getElementById('reset').addEventListener('click',clearTrace);
// light hover (when not tracing)
document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('mouseenter',()=>{ if(svg.classList.contains('tracing'))return;
    document.querySelectorAll('.elabel.sec').forEach(l=>l.style.opacity=.0);
  });
});
</script>
</body>
</html>
